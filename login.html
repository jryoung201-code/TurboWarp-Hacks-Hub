<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TurboWarp Hub — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0a14;--surface:#12121f;--surface2:#1a1a2e;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0f0ff;--muted:#8888aa;--accent:#4f46e5;--accent-h:#4338ca;--gold:#fbbf24;--gold-l:rgba(251,191,36,0.12);--gold-b:rgba(251,191,36,0.35);--red:#ef4444;--red-l:rgba(239,68,68,0.12);--red-b:rgba(239,68,68,0.35);--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.wrap{width:100%;max-width:380px;}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:2rem;cursor:pointer;}
.logo-icon{width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.logo-text{font-size:20px;font-weight:800;}.logo-text span{color:#818cf8;}
.card{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--r);padding:2rem;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,#4f46e5 0%,transparent 70%);opacity:0.15;pointer-events:none;}
.card h2{font-size:20px;font-weight:800;margin-bottom:4px;}
.card-sub{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;margin-bottom:1.5rem;}
.form-group{margin-bottom:12px;}
.form-label{font-size:11px;font-family:'Space Mono',monospace;color:var(--muted);display:block;margin-bottom:5px;}
.form-input{width:100%;padding:10px 14px;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--rs);color:var(--text);font-size:14px;font-family:'Syne',sans-serif;outline:none;transition:border-color 0.15s;}
.form-input:focus{border-color:var(--accent);}
.pw-wrap{position:relative;}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0;}
.btn-login{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;transition:background 0.15s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-login:hover{background:var(--accent-h);}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;}
.alert{padding:10px 14px;border-radius:var(--rs);font-size:12px;font-family:'Space Mono',monospace;margin-bottom:12px;display:none;align-items:center;gap:8px;}
.alert.visible{display:flex;}
.alert-error{background:var(--red-l);border:0.5px solid var(--red-b);color:var(--red);}
.alert-info{background:rgba(79,70,229,0.1);border:0.5px solid rgba(99,102,241,0.3);color:#a5b4fc;}
.divider{display:flex;align-items:center;gap:10px;margin:1.25rem 0;}
.divider-line{flex:1;height:0.5px;background:var(--border);}
.divider-text{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;}
.links{display:flex;justify-content:space-between;margin-top:1.25rem;}
.link{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:none;transition:color 0.15s;}
.link:hover{color:var(--text);}
.link-gold{color:rgba(251,191,36,0.7);}.link-gold:hover{color:var(--gold);}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.session-box{background:rgba(16,185,129,0.1);border:0.5px solid rgba(16,185,129,0.35);border-radius:var(--rs);padding:12px 16px;margin-bottom:1rem;font-size:13px;color:#6ee7b7;display:none;}
.session-box.visible{display:block;}
.attempts-warn{font-size:11px;color:var(--red);font-family:'Space Mono',monospace;margin-top:4px;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo" onclick="window.location.href='index.html'">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">TurboWarp <span>Ext Hub</span></div>
  </div>

  <div class="session-box" id="session-box"></div>

  <div class="card">
    <h2>welcome back</h2>
    <div class="card-sub">sign in to access the admin panel</div>

    <div class="alert alert-error" id="error-msg"></div>
    <div class="alert alert-info" id="info-msg"></div>

    <div class="form-group">
      <label class="form-label">username</label>
      <input class="form-input" id="username" placeholder="admin" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label class="form-label">password</label>
      <div class="pw-wrap">
        <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
        <button class="pw-toggle" onclick="togglePw()" aria-label="toggle password visibility" id="pw-toggle-btn">👁</button>
      </div>
      <div class="attempts-warn" id="attempts-warn"></div>
    </div>

    <button class="btn-login" id="login-btn" onclick="doLogin()">
      sign in
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or</div>
      <div class="divider-line"></div>
    </div>

    <div style="text-align:center;">
      <a class="link" href="index.html">← back to hub without logging in</a>
    </div>

    <div class="links" style="margin-top:1rem;">
      <a class="link link-gold" href="setup.html">👑 first time setup</a>
      <span class="link" style="color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;" id="session-timer"></span>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS = 5 * 60 * 1000; // 5 minutes
const ATTEMPTS_KEY = 'twh_login_attempts';

function getAttempts() {
  try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY)) || { count: 0, lastAttempt: 0 }; } catch { return { count: 0, lastAttempt: 0 }; }
}
function setAttempts(a) { localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(a)); }
function clearAttempts() { localStorage.removeItem(ATTEMPTS_KEY); }

function isLockedOut() {
  const a = getAttempts();
  if (a.count >= MAX_ATTEMPTS) {
    const remaining = LOCKOUT_MS - (Date.now() - a.lastAttempt);
    if (remaining > 0) return Math.ceil(remaining / 1000);
    clearAttempts();
  }
  return false;
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('visible');
  document.getElementById('info-msg').classList.remove('visible');
}
function showInfo(msg) {
  const el = document.getElementById('info-msg');
  el.textContent = 'ℹ️ ' + msg;
  el.classList.add('visible');
  document.getElementById('error-msg').classList.remove('visible');
}
function clearMessages() {
  document.getElementById('error-msg').classList.remove('visible');
  document.getElementById('info-msg').classList.remove('visible');
}

function togglePw() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function doLogin() {
  clearMessages();
  const lockout = isLockedOut();
  if (lockout) { showError('too many attempts — wait ' + lockout + 's'); return; }

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { showError('please enter username and password'); return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> signing in...';

  const result = await Auth.login(username, password);

  btn.disabled = false;
  btn.innerHTML = 'sign in';

  if (result.success) {
    clearAttempts();
    window.location.href = 'index.html?loggedin=1';
  } else {
    const a = getAttempts();
    a.count++;
    a.lastAttempt = Date.now();
    setAttempts(a);
    const remaining = MAX_ATTEMPTS - a.count;
    showError(result.error + (remaining > 0 ? ' — ' + remaining + ' attempts left' : ' — account locked for 5 minutes'));
    if (remaining <= 2) {
      document.getElementById('attempts-warn').style.display = 'block';
      document.getElementById('attempts-warn').textContent = remaining + ' attempt' + (remaining === 1 ? '' : 's') + ' before lockout';
    }
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
}

// Check existing session
function init() {
  const session = Auth.getSession();
  if (session) {
    const box = document.getElementById('session-box');
    box.textContent = '✅ you are logged in as ' + session.username + ' — redirecting to hub...';
    box.classList.add('visible');
    setTimeout(() => window.location.href = 'index.html', 1500);
    return;
  }
  // Check if redirected after logout
  const params = new URLSearchParams(window.location.search);
  if (params.get('logout') === '1') showInfo('you have been logged out');
  if (params.get('expired') === '1') showInfo('session expired — please sign in again');
}

// Enter key support
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
init();
</script>
</body>
</html>
